name: test

on:
  push:
  pull_request:

jobs:
  emacs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.1", "31.1", "snapshot"]
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Install the ClojureElisp runtime, clel, from MELPA
        run: emacs -Q --batch -l scripts/deps.el
      - name: Byte-compile, warnings as errors
        run: |
          emacs -Q --batch -L . -l scripts/deps.el \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile tod*.el
      - name: ERT
        run: |
          emacs -Q --batch -L . -l scripts/deps.el -l ert \
            $(for f in test/*-test.el; do printf -- '-l %s ' "$f"; done) \
            -f ert-run-tests-batch-and-exit
      - name: checkdoc
        run: emacs -Q --batch -L . -l scripts/deps.el -l scripts/lint-checkdoc.el tod*.el
      - name: package-lint
        run: emacs -Q --batch -L . -l scripts/lint-package.el tod*.el
